spring.application.name=pasarela

# Configuración de logging
logging.level.root=INFO
logging.level.com.um.pasarela=DEBUG

# Configuración de red
spring.cloud.inetutils.preferred-networks=127.0.0.1
spring.cloud.inetutils.ignore-loopback-interfaces=false

# Configuración de MySQL
spring.datasource.url=jdbc:mysql://mysql:3306/auth_db
spring.datasource.username=root
spring.datasource.password=rootpassword

# Configuración JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración del servidor
server.port=8083