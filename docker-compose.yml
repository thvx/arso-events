version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: eventos_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - arso_net

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - arso_net

  rabbitmq:
    image: rabbitmq:3.11-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - arso_net

  eventos-service:
    build:
      context: ./eventos-service
      dockerfile: Dockerfile
    container_name: eventos-service
    depends_on:
      - mysql
      - rabbitmq
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/eventos_db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - RABBITMQ_HOST=rabbitmq
    ports:
      - "8080:8080"
    networks:
      - arso_net

  espacios-service:
    build:
      context: ./espacios-service
      dockerfile: Dockerfile
    container_name: espacios-service
    depends_on:
      - mongodb
      - rabbitmq
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://root:rootpassword@mongodb:27017/espacios_db?authSource=admin
      - RABBITMQ_HOST=rabbitmq
    ports:
      - "8081:8081"
    networks:
      - arso_net

  reservas-service:
    build:
      context: ./reservas-service
      dockerfile: Dockerfile
    container_name: reservas-service
    depends_on:
      - mongodb
      - rabbitmq
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://root:rootpassword@mongodb:27017/reservas_db?authSource=admin
      - RABBITMQ_HOST=rabbitmq
    ports:
      - "8082:8082"
    networks:
      - arso_net

  pasarela:
    build:
      context: ./pasarela
      dockerfile: Dockerfile
    container_name: pasarela
    depends_on:
      - mysql
      - eventos-service
      - espacios-service
      - reservas-service
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/auth_db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - EVENTOS_SERVICE_URL=http://eventos-service:8080/api/eventos
      - ESPACIOS_SERVICE_URL=http://espacios-service:8081/api/espacios
      - RESERVAS_SERVICE_URL=http://reservas-service:8082/api/reservas
    ports:
      - "8083:8083"
    networks:
      - arso_net

volumes:
  mysql_data:
  mongodb_data:
  rabbitmq_data:

networks:
  arso_net:
    driver: bridge